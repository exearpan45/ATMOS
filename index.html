    <meta property="og:type" content="website" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ATMOS",
      "alternateName": "ATMOS Weather & Forecast Platform",
      "url": "https://atmos-weather.pages.dev",
      "author": {
        "@type": "Person",
        "name": "Arpan Goswami"
      },
      "applicationCategory": "WeatherApplication",
      "operatingSystem": "All",
      "description": "Premium real-time weather platform providing accurate live conditions, 24-hour hourly breakdowns, 7-day forecasts, air quality index, and interactive weather planner using  APIs.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time global weather telemetry",
        " official API integration",
        "24-Hour hourly forecast with precipitation curve",
        "7-Day daily forecast with temperature range bars",
        "Air Quality Index (AQI) with pollutant breakdown (PM2.5, PM10, NO2, O3)",
        "weather planning tools",
        "Daylight sunrise and sunset arc visualization",
        "Geolocation detection with permission control",
        "Celsius and Fahrenheit unit conversion",
        "Dark and Light theme switching",
        "Saved favorite cities and recent search history"
      ]
    }

  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
