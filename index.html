<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Primary SEO Meta Tags -->
    <title>ATMOS – Real-Time Weather & Forecast Platform</title>
    <meta name="title" content="ATMOS – Real-Time Weather & Forecast Platform" />
    <meta name="description" content="Explore accurate real-time weather conditions, 24-hour hourly forecasts, 7-day outlooks, global radar maps, and detailed air quality data with ATMOS." />
    <meta name="author" content="Arpan Goswami" />
    <meta name="keywords" content="weather, real-time forecast, meteorology, air quality index, hourly weather, 7-day forecast, precipitation radar, Open-Meteo, ATMOS" />
    <meta name="theme-color" content="#030712" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ATMOS – Real-Time Weather & Forecast Platform" />
    <meta property="og:description" content="Explore accurate real-time weather conditions, 24-hour hourly forecasts, 7-day outlooks, global radar maps, and detailed air quality data with ATMOS." />
    <meta property="og:site_name" content="ATMOS Weather" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATMOS – Real-Time Weather & Forecast Platform" />
    <meta name="twitter:description" content="Explore accurate real-time weather conditions, 24-hour hourly forecasts, 7-day outlooks, global radar maps, and detailed air quality data with ATMOS." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS for Map & Radar Visualizations -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ATMOS",
      "alternateName": "ATMOS Weather & Forecast Platform",
      "url": "https://atmos-weather.pages.dev",
      "author": {
        "@type": "Person",
        "name": "Arpan Goswami"
      },
      "applicationCategory": "WeatherApplication",
      "operatingSystem": "All",
      "description": "Premium real-time weather platform providing accurate live conditions, 24-hour hourly breakdowns, 7-day forecasts, air quality index, and interactive precipitation radar using Open-Meteo APIs.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Real-time global weather telemetry",
        "Open-Meteo official API integration",
        "24-Hour hourly forecast with precipitation curve",
        "7-Day daily forecast with temperature range bars",
        "Air Quality Index (AQI) with pollutant breakdown (PM2.5, PM10, NO2, O3)",
        "Interactive live precipitation and cloud radar map",
        "Daylight sunrise and sunset arc visualization",
        "Geolocation detection with permission control",
        "Celsius and Fahrenheit unit conversion",
        "Dark and Light theme switching",
        "Saved favorite cities and recent search history"
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
